services:
  - type: web
    name: slabok
    runtime: node
    plan: free
    buildCommand: npm install && npm run db:push && npm run build
    startCommand: npm run start
    envVars:
      - key: NODE_VERSION
        value: 24.19.0
      - key: DATABASE_URL
        sync: false
      - key: NEXTAUTH_SECRET
        sync: false
      - key: NEXTAUTH_URL
        sync: false
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_CLIENT_ID
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_SLOT_BANNER
        sync: false
      - key: NEXT_PUBLIC_ADSENSE_SLOT_BOX
        sync: false
